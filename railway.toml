# KwizBox backend — Railway / Render / Fly deploy config
#
# Railway and Render read this automatically when it sits next to the Dockerfile.
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# /health is defined in backend/src/main.py and returns {"status":"ok"}
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
