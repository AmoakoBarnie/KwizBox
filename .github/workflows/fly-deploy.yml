# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# GATED 2026-11-10: deploy-on-push disabled — owner deferred hosting work
# ("we will work on the hosting later"). Trigger is manual-only until M2.
# Before the first manual run: set the FLY_API_TOKEN repository secret
# (Fly.io dashboard → Account → API tokens) and verify fly.toml/app state.
# To re-enable continuous deployment, restore the `push: branches` trigger
# below (kept here for reference):
#   on:
#     push:
#       branches:
#         - main
#         - master

name: Fly Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
