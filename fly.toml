# KwizBox production deployment (Fly Machines).
# Secrets (JWT_SECRET, ADMIN_PASSWORD, DATABASE_URL, ...) live in `fly secrets`,
# never in this file. See docs/06-deployment/DEPLOYMENT_GUIDE.md.
app = "kwizbox-gh"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # One machine only: SQLite lives on a single persistent volume.
  strategy = "immediate"

[env]
  PORT = "8080"

[[mounts]]
  source = "kwizbox_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
