<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360">
  <rect width="320" height="360" rx="12" fill="#f7fbf8"/>
  <text x="160" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#022c1c">Plant parts</text>
  <!-- soil line -->
  <line x1="24" y1="250" x2="296" y2="250" stroke="#8a6a00" stroke-width="3"/>
  <rect x="24" y="250" width="272" height="90" fill="#e8d5a3"/>
  <!-- roots -->
  <path d="M160 250 L 130 290 L 118 330" fill="none" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M160 250 L 190 292 L 204 332" fill="none" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M160 250 L 160 320" fill="none" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M148 270 L 122 300" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M172 270 L 200 304" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>
  <text x="70" y="310" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#022c1c">Roots</text>
  <!-- stem -->
  <line x1="160" y1="250" x2="160" y2="90" stroke="#2ecc71" stroke-width="8" stroke-linecap="round"/>
  <text x="188" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#022c1c">Stem</text>
  <!-- two broad leaves -->
  <ellipse cx="104" cy="150" rx="44" ry="20" fill="#00b36b" stroke="#026b40" stroke-width="2" transform="rotate(-20 104 150)"/>
  <ellipse cx="216" cy="130" rx="44" ry="20" fill="#00b36b" stroke="#026b40" stroke-width="2" transform="rotate(22 216 130)"/>
  <line x1="160" y1="158" x2="70" y2="144" stroke="#026b40" stroke-width="2"/>
  <line x1="160" y1="122" x2="250" y2="118" stroke="#026b40" stroke-width="2"/>
  <text x="48" y="128" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#022c1c">Leaf</text>
  <!-- flower at top -->
  <circle cx="160" cy="62" r="10" fill="#ffd23f" stroke="#c99700" stroke-width="2"/>
  <circle cx="160" cy="40" r="12" fill="#ff4d5e"/>
  <circle cx="140" cy="54" r="12" fill="#ff4d5e"/>
  <circle cx="180" cy="54" r="12" fill="#ff4d5e"/>
  <circle cx="146" cy="76" r="12" fill="#ff4d5e"/>
  <circle cx="174" cy="76" r="12" fill="#ff4d5e"/>
  <circle cx="160" cy="58" r="8" fill="#ffd23f"/>
  <text x="200" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#022c1c">Flower</text>
</svg>
