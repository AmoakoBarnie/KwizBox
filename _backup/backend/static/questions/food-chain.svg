<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <rect width="480" height="200" rx="12" fill="#f7fbf8"/>
  <text x="240" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#022c1c">Food chain</text>
  <!-- grass tuft -->
  <path d="M70 140 C 62 100, 58 80, 70 70 C 78 90, 74 110, 78 140" fill="#00b36b" stroke="#022c1c" stroke-width="2"/>
  <path d="M78 140 C 80 95, 90 72, 98 68 C 96 100, 90 118, 88 140" fill="#2ecc71" stroke="#022c1c" stroke-width="2"/>
  <path d="M88 140 C 96 108, 108 86, 118 82 C 108 110, 102 126, 100 140" fill="#00b36b" stroke="#022c1c" stroke-width="2"/>
  <line x1="50" y1="140" x2="120" y2="140" stroke="#8a6a00" stroke-width="4" stroke-linecap="round"/>
  <text x="85" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#022c1c">Grass</text>
  <!-- arrow -->
  <line x1="130" y1="110" x2="180" y2="110" stroke="#1a1a1a" stroke-width="4" marker-end="url(#arr2)"/>
  <!-- grasscutter: simple side-view rodent -->
  <ellipse cx="230" cy="118" rx="38" ry="22" fill="#8b5a2b" stroke="#022c1c" stroke-width="2"/>
  <ellipse cx="262" cy="108" rx="16" ry="12" fill="#8b5a2b" stroke="#022c1c" stroke-width="2"/>
  <circle cx="270" cy="104" r="2.5" fill="#1a1a1a"/>
  <path d="M192 118 Q 176 108 180 124" fill="none" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="218" cy="138" rx="8" ry="5" fill="#6b4423"/>
  <ellipse cx="242" cy="138" rx="8" ry="5" fill="#6b4423"/>
  <text x="230" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#022c1c">Grasscutter</text>
  <!-- arrow -->
  <line x1="280" y1="110" x2="330" y2="110" stroke="#1a1a1a" stroke-width="4" marker-end="url(#arr2)"/>
  <!-- hawk silhouette in flight -->
  <path d="M360 92 L 400 108 L 440 92 L 418 108 L 438 128 L 400 114 L 362 128 L 382 108 Z" fill="#4a4a4a" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="400" cy="108" r="7" fill="#4a4a4a"/>
