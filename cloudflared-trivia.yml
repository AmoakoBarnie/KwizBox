# Cloudflare quick-tunnel ingress for Ghana STEM Trivia
# Catch-all serves the built PWA (vite preview :4173); /api and /media proxy to the FastAPI backend (:8001).
ingress:
  - path: /api
    rewrite: /api
    service: http://localhost:8001
  - path: /api/*
    rewrite: /
    service: http://localhost:8001
  - path: /media
    service: http://localhost:8001
  - path: /media/*
    service: http://localhost:8001
  - service: http://localhost:4173
