<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <rect width="400" height="240" rx="12" fill="#f4f8ff"/>
  <text x="200" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#022c1c">Series circuit</text>
  <!-- wires: rectangle loop -->
  <polyline points="80,180 80,80 170,80" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <polyline points="230,80 320,80 320,180 230,180" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <polyline points="170,180 80,180" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <!-- battery at bottom: long/short lines -->
  <line x1="170" y1="164" x2="170" y2="196" stroke="#1a1a1a" stroke-width="5"/>
  <line x1="190" y1="154" x2="190" y2="206" stroke="#1a1a1a" stroke-width="8"/>
  <line x1="210" y1="164" x2="210" y2="196" stroke="#1a1a1a" stroke-width="5"/>
  <line x1="230" y1="154" x2="230" y2="206" stroke="#1a1a1a" stroke-width="8"/>
  <text x="200" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#022c1c">Battery</text>
  <!-- bulb in a circle at top -->
  <circle cx="200" cy="80" r="22" fill="#fff8d0" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M192 72 L 200 88 L 208 72" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="194" y1="90" x2="206" y2="90" stroke="#1a1a1a" stroke-width="2"/>
  <text x="200" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#022c1c">Bulb</text>
  <!-- open switch: gap with hinged lever NOT touching -->
  <circle cx="80" cy="130" r="5" fill="#1a1a1a"/>
  <circle cx="80" cy="158" r="5" fill="#1a1a1a"/>
  <line x1="80" y1="80" x2="80" y2="125" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="80" y1="163" x2="80" y2="180" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="80" y1="130" x2="118" y2="112" stroke="#ff4d5e" stroke-width="4" stroke-linecap="round"/>
  <text x="142" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ff4d5e">Switch (open)</text>
</svg>
