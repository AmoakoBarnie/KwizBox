  <line x1="158" y1="54" x2="180" y2="52" stroke="#022c1c" stroke-width="1.5"/>
  <!-- B lungs -->
  <ellipse cx="118" cy="168" rx="22" ry="32" fill="#ffd23f" stroke="#c99700" stroke-width="2"/>
