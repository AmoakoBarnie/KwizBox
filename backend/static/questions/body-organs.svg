<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 360" width="280" height="360">
  <rect width="280" height="360" rx="12" fill="#f7fbf8"/>
  <text x="140" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#022c1c">Body organs</text>
