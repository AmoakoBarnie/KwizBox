  <path d="M140 186 C 140 174, 126 170, 122 180 C 118 190, 140 204, 140 204 C 140 204, 162 190, 158 180 C 154 170, 140 174, 140 186 Z" fill="#ff4d5e" stroke="#b01224" stroke-width="2"/>
